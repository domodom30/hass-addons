name: Sync versions to README

# Keeps version numbers in the docs/manifests in sync with each add-on's
# config (the source of truth). Runs after a version bump lands on master.

on:
  push:
    branches: [master]
    # Trigger only on the SOURCE-OF-TRUTH files (not the generated ones), so
    # the bot's own sync commit never re-triggers this workflow.
    paths:
      - "ha-bluetooth-audio-manager/bluetooth_audio_manager/config.yaml"
      - "ttlock-hass-integration/config.yaml"
      - "scripts/sync_versions.py"
      - ".github/workflows/sync-versions.yaml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-versions
  cancel-in-progress: false

jobs:
  sync:
    name: Sync version numbers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync versions
        run: python3 scripts/sync_versions.py

      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Versions already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync version numbers to README [skip ci]"
          git push
